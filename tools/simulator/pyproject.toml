[project]
name = "stayops-simulator"
version = "0.1.0"
description = "StayOps 합성 데이터 생성 및 오프라인 시뮬레이션 도구 (실제 운영 데이터 아님)"
readme = "README.md"
authors = [
    { name = "maantano", email = "maantano@naver.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stayops-simulator = "stayops_simulator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
