spring:
  application:
    name: stayops-api
  datasource:
    url: ${STAYOPS_DB_URL:jdbc:postgresql://localhost:5432/stayops}
    username: ${STAYOPS_DB_USER:stayops}
    password: ${STAYOPS_DB_PASSWORD:stayops}
    hikari:
      # ADR-003: 객실 잠금 대기 상한. 초과 시 409 VERSION_CONFLICT
      connection-init-sql: "SET lock_timeout = '${stayops.db.lock-timeout}'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 변경한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${STAYOPS_API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness, /actuator/health/readiness 분리
      show-details: never

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"

stayops:
  # 데모 모드 표시 (v4.1 04 §11). 실제 운영 데이터가 아님을 명시한다.
  demo-mode: true
  demo:
    # demo profile: 데모 데이터를 매일 이 시각(호텔 시간)에 새로 만든다. 시작할 때도 이 기준으로 낡았으면 새로 만든다.
    refresh-at: "04:00"
    refresh-check-interval: PT10M
    # true면 시작할 때 무조건 새로 만든다(운영 테스트를 깨끗한 데모 데이터로 시작할 때)
    force-refresh-on-startup: false
  web:
    # CORS 허용 origin (쉼표 구분). 배포 환경에서 반드시 지정한다.
    allowed-origins: ${STAYOPS_WEB_ALLOWED_ORIGINS:http://localhost:3000}
  db:
    lock-timeout: 5s
  housekeeping:
    # 예상 소요시간 기본값(분). 합성 시뮬레이션용 ASSUMPTION — 업계 표준·실측치가 아님 (v4.1 01 §8)
    default-duration-minutes:
      CHECKOUT_CLEANING: 45
      RE_CLEANING: 30
      INSPECTION: 10
      STAYOVER_CLEANING: 25
  readiness:
    # 모두 ASSUMPTION (현장 표준 아님, OPEN-7)
    warning-margin-minutes: 30
    evaluation-window-hours: 24
    calculation-version: readiness-v1
